# Merge these roles into the active OMP config.yml; do not overwrite other settings.
# Any supported authenticated model selector may be used, independently of DEFAULT.
# Reviews are required for orchestrate checkpoints, independent high-risk plans,
# and multi-implementation-worker dispatch. Reload with /reload-plugins after changes.
modelRoles:
  task_easy: "@smol"
  task_hard: "@task" # retain any existing assignment
  task_challenge: "@slow"
  orche-advisor: openai-codex/gpt-6-astra:xhigh
  verification-auditor: "@smol" # separate from ADVISOR; customize independently
